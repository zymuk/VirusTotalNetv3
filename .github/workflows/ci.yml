name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/VirusTotalNet.v3.sln

      - name: Build
        run: dotnet build src/VirusTotalNet.v3.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/VirusTotalNet.v3.sln --configuration Release --no-build